<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#090909"/>
  <!-- grid -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- color bar top -->
  <rect x="0" y="0" width="300" height="4" fill="#e8231a"/>
  <rect x="300" y="0" width="300" height="4" fill="#f5a800"/>
  <rect x="600" y="0" width="300" height="4" fill="#3a9e2f"/>
  <rect x="900" y="0" width="300" height="4" fill="#1a5bbf"/>
  <!-- logo bar -->
  <rect x="80" y="240" width="4" height="60" fill="#1a5bbf"/>
  <!-- wordmark -->
  <text x="100" y="272" font-family="sans-serif" font-weight="800" font-size="52" fill="#f5f5f0">
    <tspan fill="#e8231a">on</tspan><tspan>fire</tspan>
  </text>
  <text x="100" y="298" font-family="sans-serif" font-weight="700" font-size="13" fill="#1a5bbf" letter-spacing="4">SYSTEMS</text>
  <!-- tagline -->
  <text x="80" y="380" font-family="sans-serif" font-weight="300" font-size="26" fill="rgba(245,245,240,0.6)">Infraestructura · Arquitectura · Software</text>
  <text x="80" y="420" font-family="sans-serif" font-weight="300" font-size="22" fill="rgba(245,245,240,0.4)">Tecnología empresarial para Colombia</text>
  <!-- url -->
  <text x="80" y="550" font-family="sans-serif" font-size="18" fill="rgba(245,245,240,0.3)">onfiresystems.co</text>
  <!-- decorative blob -->
  <circle cx="1050" cy="200" r="280" fill="#e8231a" opacity="0.06"/>
  <circle cx="900" cy="450" r="180" fill="#1a5bbf" opacity="0.07"/>
</svg>
